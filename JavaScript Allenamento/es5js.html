<!DOCTYPE html>
<html lang="italian">
<head>
    <meta charset="UTF-8">
    <title>Es5</title>
</head>
<body>
    <script>
        let n=prompt("Inserisci un numero");
        alert("Tabellina del "+n);
        for(let i=1; i<=10; i++){
            alert(n+" x "+i+" = "+(n*i));
        }
    </script>
</body>
<h1>Esercizio 5</h1>
<hr>
<h2>Esercitazione JavaScript</h2>
</html>
