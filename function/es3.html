<!DOCTYPE html>
<html lang="italian">
<head>
    <meta charset="UTF-8">
    <title>Es3</title>
</head>
<body>
    <script>
        let raggio = parseFloat(prompt("Inserisci il raggio del cerchio:"));
        function areaCerchio(raggio) {
            const area = Math.PI * Math.pow(raggio, 2);
            const diametro = 2 * raggio;
            alert("L'area del cerchio è: " + area+ "\nIl diametro del cerchio è: " + diametro);
        }
        areaCerchio(raggio);
    </script>
</body>
<h1>Esercizio 3</h1>
<hr>
<h2>Esercitazione JavaScript</h2>
</html>
