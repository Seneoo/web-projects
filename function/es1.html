<!DOCTYPE html>
<html lang="italian">
<head>
    <meta charset="UTF-8">
    <title>Es1</title>
</head>
<body>
    <script>
        let num1 = parseFloat(prompt("Inserisci il primo numero:"));
        let num2 = parseFloat(prompt("Inserisci il secondo numero:"));
        function maggiore(num1, num2)
        {
            if (num1 > num2) 
            {
                console.log("Il maggiore è: " + num1);
            } else if (num2 > num1) 
            {
                console.log("Il maggiore è: " + num2);
            } else 
            {
                alert("I numeri sono uguali");
            }
        }
        maggiore(num1, num2);
    </script>
</body>
<h1>Esercizio 1</h1>
<hr>
<h2>Esercitazione JavaScript</h2>
</html>
